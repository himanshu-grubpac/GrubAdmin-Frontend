name: CI

on:
  pull_request:
    branches:
      - develop
      - staging
      - pre-prod
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: https://ci.example.com/api/v1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Build
        run: npm run build
