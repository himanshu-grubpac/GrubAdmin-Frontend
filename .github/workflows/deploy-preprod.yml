name: Deploy Pre-Production

on:
  push:
    branches:
      - pre-prod

concurrency:
  group: admin-fe-ec2-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: https://ci.example.com/api/v1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Build
        run: npm run build

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: pre-production
    steps:
      - uses: actions/checkout@v4

      - name: Check pre-prod slot configured
        id: slot
        run: |
          if [ -z "${{ secrets.PREPROD_DEPLOY_PATH }}" ] || \
             [ -z "${{ secrets.EC2_HOST }}" ] || \
             [ -z "${{ secrets.EC2_SSH_KEY }}" ] || \
             [ -z "${{ secrets.EC2_USER }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pre-prod slot not configured::Set PREPROD_DEPLOY_PATH, EC2_HOST, EC2_USER, EC2_SSH_KEY in the pre-production environment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH key
        if: steps.slot.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config << 'CFG'
          Host *
            ServerAliveInterval 15
            ServerAliveCountMax 120
            TCPKeepAlive yes
          CFG

      - name: Add EC2 host to known_hosts
        if: steps.slot.outputs.configured == 'true'
        run: |
          HOST="${{ secrets.EC2_HOST }}"
          success=false
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 20 -t ed25519,ecdsa,rsa -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              success=true
              break
            fi
            echo "ssh-keyscan attempt $attempt failed, retrying..."
            sleep 5
          done
          if [ "$success" != "true" ]; then
            echo "ssh-keyscan failed for host (check EC2_HOST and EC2 security group port 22)"
            exit 1
          fi

      - name: Start build on EC2 (detached)
        if: steps.slot.outputs.configured == 'true'
        run: |
          ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=120 \
            -i ~/.ssh/id_ed25519 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e
            cd ${{ secrets.PREPROD_DEPLOY_PATH }}
            git stash
            git pull origin pre-prod
            LOG=/tmp/fe-deploy-preprod.log
            PIDFILE=/tmp/fe-deploy-preprod.pid
            rm -f "\$LOG" "\$PIDFILE"
            nohup bash -c '
              set -e
              cd ${{ secrets.PREPROD_DEPLOY_PATH }}
              export FE_CONTAINER_NAME=grub-admin-frontend-preprod
              export FE_HOST_PORT=3002
              export DOCKER_BUILDKIT=1
              export COMPOSE_DOCKER_CLI_BUILD=1
              docker compose -p grubadmin-fe-preprod -f docker-compose.frontend.yml build
              docker compose -p grubadmin-fe-preprod -f docker-compose.frontend.yml up -d
            ' > "\$LOG" 2>&1 &
            echo \$! > "\$PIDFILE"
            echo "Deploy started (pid \$(cat "\$PIDFILE"))"
          EOF

      - name: Wait for frontend ready
        if: steps.slot.outputs.configured == 'true'
        run: |
          SSH="ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=120 -i ~/.ssh/id_ed25519 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}"
          ready=false
          for i in $(seq 1 40); do
            if $SSH "curl -sf http://127.0.0.1:3002/ >/dev/null"; then
              ready=true
              break
            fi
            if $SSH "test -f /tmp/fe-deploy-preprod.pid && kill -0 \$(cat /tmp/fe-deploy-preprod.pid) 2>/dev/null"; then
              echo "build still running (attempt $i)..."
            else
              echo "deploy script finished, waiting for frontend HTTP (attempt $i)..."
            fi
            sleep 15
          done
          if [ "$ready" != "true" ]; then
            echo "frontend health check failed on port 3002"
            $SSH "tail -100 /tmp/fe-deploy-preprod.log" || true
            $SSH "docker logs grub-admin-frontend-preprod --tail 50" || true
            exit 1
          fi

      - name: Done
        if: steps.slot.outputs.configured == 'true'
        run: echo "Admin frontend deployed successfully to pre-prod slot"
